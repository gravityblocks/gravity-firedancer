[package]
name = "gravity-wire-vectors"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Cargo.lock pins the wire crates to the versions the relay is built with:
#   gravity-types  git tag v0.4.1 = b35d90566cdffa272cff059fb7cd7b01109e3031
#   flux           git 49cb677158a30e20a70d2e1391abbed453bbb68d
#   wincode 0.6.1, wincode-derive 0.5.1
[dependencies]
gravity-types = { git = "https://github.com/gravityblocks/gravity-connector.git", tag = "v0.4.1" }
flux = { git = "https://github.com/gattaca-com/flux.git", features = ["wincode"], version = "0.8.2" }
flux-network = { git = "https://github.com/gattaca-com/flux.git", features = ["wincode"], version = "0.8.2" }
solana-address = { version = "2", features = ["curve25519", "decode", "wincode"] }
solana-hash = "4"
solana-keypair = "3.1"
solana-message = "=4.5.0"
solana-signature = { version = "3", features = ["verify"] }
solana-signer = "3.0"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
serde_json = "1"
wincode = "=0.6.1"
